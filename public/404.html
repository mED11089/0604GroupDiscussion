<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>頁面不存在 — 異位性皮膚炎全身性治療 SDM 指引</title>
  <meta name="robots" content="noindex" />
  <!--
    GitHub Pages SPA fallback：
    任何不存在的路徑都會落到本檔。此站為單頁錨點網站，
    這裡直接導回首頁（請與 vite.config.js 的 base 一致）。
  -->
  <script>
    (function () {
      var repo = '/0604GroupDiscussion/';
      // 保留 hash（例如 #treatments），導回首頁
      var hash = window.location.hash || '';
      window.location.replace(repo + hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #155e75); color: #fff; text-align: center; padding: 2rem; }
    a { color: #a5f3fc; }
  </style>
</head>
<body>
  <div>
    <h1 style="font-size:3rem;margin:0;">404</h1>
    <p>找不到這個頁面，正在帶您回首頁……</p>
    <p><a href="/0604GroupDiscussion/">立即返回首頁</a></p>
  </div>
</body>
</html>
